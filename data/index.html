<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#040408">
<title>Bumptima</title>


<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --g:    #00ff64;
  --g50:  rgba(0,255,100,0.5);
  --g20:  rgba(0,255,100,0.2);
  --g10:  rgba(0,255,100,0.1);
  --g05:  rgba(0,255,100,0.05);
  --blue: #4fc3f7;
  --b20:  rgba(79,195,247,0.2);
  --b10:  rgba(79,195,247,0.1);
  --bg:   #040408;
  --line: rgba(0,255,100,0.14);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--g);
  font-family: 'Courier New', Courier, monospace;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--vh, 1vh) * 100);
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 38px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  background: rgba(4,4,12,0.97);
  z-index: 10;
}
.hdr-title {
  font-size: 0.82rem;
  letter-spacing: 6px;
  font-weight: bold;
  text-shadow: 0 0 14px var(--g);
}
.hdr-counts {
  display: flex;
  gap: 14px;
  font-size: 0.58rem;
  letter-spacing: 1px;
}
.count-w { color: var(--g50); }
.count-b { color: rgba(79,195,247,0.6); }
.pulse {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--g);
  box-shadow: 0 0 8px var(--g);
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

/* ── Radar section ── */
.radar-sec {
  flex: 0 0 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  background: radial-gradient(ellipse at center,
    rgba(0,20,8,0.6) 0%, var(--bg) 70%);
}
.radar-sec::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 3px,
    rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 5;
}

.radar-wrap {
  position: relative;
  z-index: 2;
}
.radar-wrap::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,100,0.15);
}
.radar-wrap::after {
  content: '';
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,100,0.06);
}

.radar-disc {
  border-radius: 50%;
  border: 2px solid var(--g50);
  box-shadow:
    0 0 28px rgba(0,255,100,0.22),
    0 0 64px rgba(0,255,100,0.06),
    inset 0 0 32px rgba(0,0,0,0.8);
  overflow: hidden;
  position: relative;
}

.radar-bg {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, #061209 0%, #030806 100%);
}

#rc {
  position: absolute; inset: 0;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
}

.compass {
  position: absolute;
  inset: -20px;
  pointer-events: none;
  font-size: 0.5rem;
  color: rgba(0,255,100,0.45);
  letter-spacing: 1px;
  z-index: 4;
}
.compass span { position: absolute; }
.compass .N { top: 0;    left: 50%; transform: translateX(-50%); }
.compass .S { bottom: 0; left: 50%; transform: translateX(-50%); }
.compass .E { right: 0;  top: 50%;  transform: translateY(-50%); }
.compass .W { left: 0;   top: 50%;  transform: translateY(-50%); }

.radar-footer {
  position: absolute;
  bottom: 6px; left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  font-size: 0.56rem;
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 6;
}
.rf-w { color: var(--g50); }
.rf-b { color: rgba(79,195,247,0.55); }
.loc-src {
  font-size: 0.48rem;
  letter-spacing: 1px;
  padding: 1px 5px;
  border-radius: 2px;
  border: 1px solid;
}
.loc-src.gps    { color: var(--g50); border-color: rgba(0,255,100,0.25); }
.loc-src.ip     { color: rgba(255,200,0,0.6); border-color: rgba(255,200,0,0.25); }
.loc-src.saved  { color: rgba(79,195,247,0.7); border-color: rgba(79,195,247,0.3); }
.loc-src.manual { color: rgba(79,195,247,0.7); border-color: rgba(79,195,247,0.3); }

/* Location set button */
.loc-btn {
  background: none; border: 1px solid rgba(0,255,100,0.2);
  color: rgba(0,255,100,0.5); font-family: inherit; font-size: 0.52rem;
  letter-spacing: 1px; padding: 1px 6px; border-radius: 2px; cursor: pointer;
  pointer-events: auto;
  transition: all 0.15s;
}
.loc-btn:hover, .loc-btn:active { color: var(--g); border-color: var(--g50); background: rgba(0,255,100,0.07); }

/* Location modal */
.loc-modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.9);
  align-items: center; justify-content: center;
}
.loc-modal.show { display: flex; }
.loc-box {
  background: #070b0f;
  border: 1px solid rgba(0,255,100,0.3);
  border-radius: 6px; padding: 22px 20px;
  width: min(340px, 92vw);
  display: flex; flex-direction: column; gap: 12px;
}
.loc-box-title {
  font-size: 0.7rem; letter-spacing: 3px;
  color: var(--g); text-shadow: 0 0 10px var(--g);
}
.loc-saved-label {
  font-size: 0.58rem; color: rgba(79,195,247,0.6);
  letter-spacing: 1px; min-height: 1em;
}
.loc-input {
  background: rgba(0,255,100,0.04);
  border: 1px solid rgba(0,255,100,0.25);
  color: #c8ffd4;
  font-family: 'Courier New', monospace; font-size: 0.72rem;
  padding: 8px 10px; border-radius: 3px; outline: none;
  width: 100%;
  transition: border-color 0.15s;
}
.loc-input:focus { border-color: var(--g50); }
.loc-input::placeholder { color: rgba(0,255,100,0.25); }
.loc-status {
  font-size: 0.58rem; letter-spacing: 1px; min-height: 1em;
  color: rgba(0,255,100,0.45);
}
.loc-status.err { color: rgba(255,80,80,0.7); }
.loc-btns { display: flex; gap: 10px; }
.loc-set-btn {
  flex: 1; background: rgba(0,255,100,0.08);
  border: 1px solid var(--g50); color: var(--g);
  font-family: inherit; font-size: 0.65rem; letter-spacing: 2px;
  padding: 7px; border-radius: 3px; cursor: pointer;
  transition: all 0.15s;
}
.loc-set-btn:hover { background: rgba(0,255,100,0.15); }
.loc-set-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.loc-cancel-btn {
  background: none; border: 1px solid rgba(0,255,100,0.15);
  color: rgba(0,255,100,0.4); font-family: inherit; font-size: 0.65rem;
  padding: 7px 14px; border-radius: 3px; cursor: pointer;
  transition: all 0.15s;
}
.loc-cancel-btn:hover { color: var(--g50); border-color: rgba(0,255,100,0.3); }

/* ── Device list section — two columns, no tabs ── */
.list-sec {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-top: 1px solid var(--line);
}

/* Column headers */
.col-headers {
  display: flex;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  background: rgba(4,4,12,0.9);
}
.col-hdr {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 10px;
  font-size: 0.6rem;
  letter-spacing: 2px;
}
.col-hdr:first-child {
  border-right: 1px solid var(--line);
  color: var(--g);
  text-shadow: 0 0 8px var(--g);
}
.col-hdr:last-child {
  color: var(--blue);
  text-shadow: 0 0 8px var(--blue);
}
.col-hdr .ts {
  font-size: 0.5rem;
  opacity: 0.4;
  letter-spacing: 0;
}

/* Two-column scroll area */
.cols {
  display: flex;
  flex: 1;
  min-height: 0;
}

.col {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  min-width: 0;
}
.col:first-child { border-right: 1px solid rgba(0,255,100,0.08); }

.col::-webkit-scrollbar { width: 3px; }
.col::-webkit-scrollbar-thumb { background: rgba(0,255,100,0.2); border-radius: 2px; }

/* Device row */
.dev {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border-bottom: 1px solid rgba(0,255,100,0.04);
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateX(-3px); } to { opacity: 1; } }

.dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.dot-w { background: var(--g);    box-shadow: 0 0 4px var(--g); }
.dot-b { background: var(--blue); box-shadow: 0 0 4px var(--blue); }

.dev-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.65rem;
  color: #c8ffd4;
  min-width: 0;
}
.dev-name.dim  { color: rgba(255,255,255,0.22); font-style: italic; }
.dev-name.bt-n { color: #b3e5fc; }

/* Signal bars */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 10px;
  flex-shrink: 0;
}
.bar { width: 3px; border-radius: 1px; }
.bar.off { background: rgba(0,255,100,0.1); }
.bar.on  { background: var(--g); }
.bar.bt.on { background: var(--blue); }

.dbm {
  font-size: 0.54rem;
  color: var(--g50);
  white-space: nowrap;
  flex-shrink: 0;
}
.dbm.bt { color: rgba(79,195,247,0.5); }

/* Only show ch tag on wider screens to save space */
.tag {
  font-size: 0.5rem;
  color: rgba(0,255,100,0.25);
  background: var(--g05);
  border: 1px solid rgba(0,255,100,0.08);
  padding: 1px 3px;
  border-radius: 2px;
  white-space: nowrap;
  flex-shrink: 0;
}
.tag.bt {
  color: rgba(79,195,247,0.28);
  background: rgba(79,195,247,0.05);
  border-color: rgba(79,195,247,0.12);
}

.empty {
  padding: 16px 10px;
  text-align: center;
  font-size: 0.6rem;
  color: rgba(0,255,100,0.18);
  letter-spacing: 1px;
}

.skel {
  height: 26px; margin: 4px 8px; border-radius: 3px;
  background: linear-gradient(90deg,
    rgba(0,255,100,0.03) 25%,
    rgba(0,255,100,0.07) 50%,
    rgba(0,255,100,0.03) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
</style>
</head>

<body>

<!-- ── Header ── -->
<header class="hdr">
  <div class="hdr-title">BUMPTIMA</div>
  <div class="hdr-counts">
    <span class="count-w" id="hc-w">WIFI: —</span>
    <span class="count-b" id="hc-b">BT: —</span>
  </div>
  <a href="/log.html" style="
    font-family:inherit;font-size:0.55rem;letter-spacing:1px;
    color:rgba(0,255,100,0.45);text-decoration:none;
    border:1px solid rgba(0,255,100,0.2);padding:2px 7px;border-radius:3px;
  ">LOG</a>
  <div class="pulse"></div>
</header>

<!-- ── Radar ── -->
<section class="radar-sec">
  <div class="radar-wrap" id="rw">
    <div class="radar-disc" id="rd">
      <div class="radar-bg"></div>
      <canvas id="rc"></canvas>
    </div>
    <div class="compass">
      <span class="N">N</span><span class="S">S</span>
      <span class="E">E</span><span class="W">W</span>
    </div>
  </div>
  <div class="radar-footer">
    <span class="rf-w" id="rf-w">● 0 WIFI</span>
    <span class="loc-src" id="loc-src" style="display:none"></span>
    <button class="loc-btn" onclick="openLocModal()">📍 SET</button>
    <span class="rf-b" id="rf-b">◆ 0 BT</span>
  </div>
</section>

<!-- ── Location modal ── -->
<div class="loc-modal" id="loc-modal">
  <div class="loc-box">
    <div class="loc-box-title">SET LOCATION</div>
    <div class="loc-saved-label" id="loc-saved-label"></div>
    <input class="loc-input" id="loc-input"
           type="text" placeholder="e.g. Chenal Promenade Little Rock"
           autocomplete="off" autocorrect="off" spellcheck="false"/>
    <div class="loc-status" id="loc-status"></div>
    <div class="loc-btns">
      <button class="loc-set-btn" id="loc-set-btn" onclick="geocodeAndSet()">FIND &amp; SET</button>
      <button class="loc-cancel-btn" onclick="closeLocModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- ── Side-by-side device lists ── -->
<div class="list-sec">

  <div class="col-headers">
    <div class="col-hdr">
      <span>◉ WIFI</span>
      <span class="ts" id="ts-w">—</span>
    </div>
    <div class="col-hdr">
      <span>◈ BLUETOOTH</span>
      <span class="ts" id="ts-b">—</span>
    </div>
  </div>

  <div class="cols">
    <div class="col" id="ls-w">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
    <div class="col" id="ls-b">
      <div class="skel"></div><div class="skel"></div>
    </div>
  </div>

</div>

<script>
'use strict';

const S = { wifi: [], bt: [] };
let cSize = 0, sweepA = 0;
const SWEEP_SPEED = 0.017;

// ── Location storage ──────────────────────────────────────────────────────────
const LOC_KEY = 'bumptima_loc';

function loadSavedLoc() {
  try { const d = JSON.parse(localStorage.getItem(LOC_KEY)); if (d?.lat) return d; } catch(_){}
  return null;
}
function saveLoc(lat, lng, label) {
  try { localStorage.setItem(LOC_KEY, JSON.stringify({ lat, lng, label })); } catch(_){}
}

// ── Location modal ────────────────────────────────────────────────────────────
function openLocModal() {
  const saved = loadSavedLoc();
  const lbl   = document.getElementById('loc-saved-label');
  lbl.textContent = saved ? `CURRENT: ${saved.label || saved.lat.toFixed(4) + ', ' + saved.lng.toFixed(4)}` : '';
  document.getElementById('loc-input').value   = '';
  document.getElementById('loc-status').textContent = '';
  document.getElementById('loc-status').className   = 'loc-status';
  document.getElementById('loc-modal').classList.add('show');
  setTimeout(() => document.getElementById('loc-input').focus(), 100);
}
function closeLocModal() {
  document.getElementById('loc-modal').classList.remove('show');
}

async function geocodeAndSet() {
  const q   = document.getElementById('loc-input').value.trim();
  if (!q) return;
  const btn = document.getElementById('loc-set-btn');
  const st  = document.getElementById('loc-status');
  btn.disabled = true;
  st.className = 'loc-status';
  st.textContent = 'SEARCHING...';

  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data.length) { st.textContent = 'NOT FOUND — TRY A DIFFERENT QUERY'; st.className = 'loc-status err'; btn.disabled = false; return; }
    const { lat, lon, display_name } = data[0];
    const label = display_name.split(',').slice(0, 2).join(',').trim();
    saveLoc(+lat, +lon, label);
    applyLocation(+lat, +lon, 'manual', label);
    closeLocModal();
  } catch(e) {
    st.textContent = 'ERROR — CHECK INTERNET CONNECTION'; st.className = 'loc-status err';
  }
  btn.disabled = false;
}

// Enter key submits
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loc-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') geocodeAndSet();
  });
});

function applyLocation(lat, lng, src, label) {
  const badge = document.getElementById('loc-src');
  const labels = { gps: '▲ GPS', ip: '◎ IP', saved: '📍 ' + (label || 'SAVED'), manual: '📍 ' + (label || 'SET') };
  badge.textContent   = labels[src] || src.toUpperCase();
  badge.className     = `loc-src ${src === 'manual' ? 'saved' : src}`;
  badge.style.display = '';
}

// ── Radar canvas ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('rc');
const ctx    = canvas.getContext('2d', { alpha: true });

function sizeRadar() {
  const sec  = document.querySelector('.radar-sec');
  const side = Math.floor(Math.min(sec.clientWidth, sec.clientHeight) * 0.86);
  cSize = side;
  canvas.width  = side;
  canvas.height = side;
  document.getElementById('rd').style.width  = side + 'px';
  document.getElementById('rd').style.height = side + 'px';
}

function idToAngle(s) {
  let h = 0x811c9dc5 | 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return ((h >>> 0) / 0xffffffff) * Math.PI * 2;
}

function rssiToR(rssi, maxR) {
  const c = Math.max(-100, Math.min(-20, rssi));
  const n = (c - (-20)) / (-100 - (-20));
  return (0.07 + n * 0.83) * maxR;
}

function drawFrame() {
  const SZ = cSize;
  if (SZ < 4) { requestAnimationFrame(drawFrame); return; }
  const cx = SZ / 2, cy = SZ / 2, R = SZ / 2 - 2;
  ctx.clearRect(0, 0, SZ, SZ);

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();

  for (let i = 1; i <= 4; i++) {
    ctx.beginPath(); ctx.arc(cx, cy, (i / 4) * R, 0, Math.PI * 2);
    ctx.strokeStyle = i === 4 ? 'rgba(0,255,100,0.16)' : 'rgba(0,255,100,0.07)';
    ctx.lineWidth = 1; ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(0,255,100,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();

  ctx.strokeStyle = 'rgba(0,255,100,0.04)'; ctx.lineWidth = 0.5;
  [1, -1].forEach(sign => {
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.72, cy - sign * R * 0.72);
    ctx.lineTo(cx + R * 0.72, cy + sign * R * 0.72);
    ctx.stroke();
  });

  // Sweep trail — use a single gradient-filled sector to avoid opacity accumulation
  const TRAIL_ARC = Math.PI * 0.45;   // 81° trail
  const TRAIL_STEPS = 18;
  for (let i = 0; i < TRAIL_STEPS; i++) {
    const frac = i / TRAIL_STEPS;
    const a0   = sweepA - frac * TRAIL_ARC;
    const a1   = a0 - TRAIL_ARC / TRAIL_STEPS;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a1, true); ctx.closePath();
    ctx.fillStyle = `rgba(0,255,100,${0.028 * Math.pow(1 - frac, 1.8)})`;
    ctx.fill();
  }

  ctx.save();
  ctx.shadowColor = '#00ff64'; ctx.shadowBlur = 9;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(sweepA) * R, cy + Math.sin(sweepA) * R);
  ctx.strokeStyle = 'rgba(0,255,100,0.92)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();

  [
    ...S.wifi.map(d => ({ id: d.bssid, rssi: d.rssi, t: 'w' })),
    ...S.bt.map(d => ({ id: d.addr, rssi: (d.rssi > -100) ? d.rssi : -80, t: 'b' })),
  ].forEach(({ id, rssi, t }) => {
    const r = rssiToR(rssi, R), a = idToAngle(id);
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    const color     = t === 'w' ? '#00ff64' : '#4fc3f7';
    const glowRgb   = t === 'w' ? '0,255,100' : '79,195,247';

    // Angle delta between sweep line and this dot (wrapped to [0, 2π))
    let da = ((sweepA - a) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    // da ≈ 0 means the sweep just passed over; da close to 2π also means just about to
    // We want "just swept over" = small positive da (sweep passed within last ~25°)
    const PING_ARC  = Math.PI * (25 / 180); // 25° window after sweep passes
    const pingFrac  = da < PING_ARC ? (1 - da / PING_ARC) : 0; // 1→0 as sweep recedes

    // Outer glow halo (subtle always-on, bright on ping)
    const haloR = 8 + pingFrac * 6;
    const haloA = 0.10 + pingFrac * 0.40;
    ctx.beginPath(); ctx.arc(x, y, haloR, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${glowRgb},${haloA})`; ctx.fill();

    // Expanding ping ring
    if (pingFrac > 0) {
      const ringR = 10 + (1 - pingFrac) * 22;
      const ringA = pingFrac * 0.85;
      ctx.beginPath(); ctx.arc(x, y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${glowRgb},${ringA})`;
      ctx.lineWidth = 1.5 + pingFrac * 1.5; ctx.stroke();
      ctx.lineWidth = 1;
    }

    // Core dot — bright white-flash on ping, otherwise solid color
    const coreR = 4 + pingFrac * 3;
    const flashR = Math.floor(pingFrac * 255); // 0→255
    const flashG = Math.floor(255 * (t === 'w' ? 1 : 0.76 + pingFrac * 0.24));
    const flashB = Math.floor(pingFrac * 255 * (t === 'b' ? 1 : 0.4));
    const dotColor = pingFrac > 0.05
      ? `rgb(${255},${flashG},${flashB})`
      : color;
    ctx.beginPath(); ctx.arc(x, y, coreR, 0, Math.PI * 2);
    ctx.fillStyle = dotColor;
    ctx.shadowColor = pingFrac > 0.05 ? '#ffffff' : color;
    ctx.shadowBlur  = 10 + pingFrac * 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Persistent dim trail dot (so dot is always visible even after sweep passes)
    // Already covered by the always-visible halo above; add a subtle inner ring
    ctx.beginPath(); ctx.arc(x, y, coreR + 2.5, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${glowRgb},0.28)`; ctx.lineWidth = 1; ctx.stroke();
    ctx.lineWidth = 1;
  });

  ctx.restore();
  sweepA += SWEEP_SPEED;
  if (sweepA > Math.PI * 2) sweepA -= Math.PI * 2;
  requestAnimationFrame(drawFrame);
}

// ── Render helpers ────────────────────────────────────────────────────────────
const BAR_H = ['3px','5px','7px','10px'];
function sigBars(rssi, bt = false) {
  const lvl = rssi > -50 ? 4 : rssi > -65 ? 3 : rssi > -75 ? 2 : rssi > -85 ? 1 : 0;
  const cls = bt ? 'bt' : '';
  return '<div class="bars">' +
    BAR_H.map((h, i) =>
      `<div class="bar ${cls} ${i < lvl ? 'on' : 'off'}" style="height:${h}"></div>`
    ).join('') + '</div>';
}

const AUTH  = ['OPEN','WEP','WPA','WPA2','WPA+2','WPA3','?'];
const COD_M = ['MISC','PC','PHONE','LAN','AV','INPUT','IMG','WEAR','TOY','MED'];
function codStr(cod) { return COD_M[(cod >> 8) & 0x1f] || 'DEV'; }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderWifi(list) {
  if (!list.length) return '<div class="empty">SCANNING...</div>';
  return [...list].sort((a, b) => b.rssi - a.rssi).map(d => `
    <div class="dev">
      <div class="dot dot-w"></div>
      <div class="dev-name ${d.ssid ? '' : 'dim'}">${esc(d.ssid || '[hidden]')}</div>
      ${sigBars(d.rssi)}
      <div class="dbm">${d.rssi}</div>
      <div class="tag">CH${d.channel}</div>
    </div>`).join('');
}

function renderBt(list) {
  if (!list.length) return '<div class="empty">INQUIRING...</div>';
  return [...list].sort((a, b) => b.rssi - a.rssi).map(d => `
    <div class="dev">
      <div class="dot dot-b"></div>
      <div class="dev-name bt-n">${esc(d.name || d.addr)}</div>
      ${sigBars(d.rssi, true)}
      <div class="dbm bt">${d.rssi > -100 ? d.rssi : '—'}</div>
      <div class="tag bt">${codStr(d.cod)}</div>
    </div>`).join('');
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchScan() {
  try {
    const res = await fetch('/api/scan');
    if (!res.ok) return;
    const d = await res.json();
    S.wifi = d.wifi ?? [];
    S.bt   = d.bt   ?? [];

    document.getElementById('ls-w').innerHTML = renderWifi(S.wifi);
    document.getElementById('ls-b').innerHTML = renderBt(S.bt);

    const wc = S.wifi.length, bc = S.bt.length;
    document.getElementById('hc-w').textContent = `WIFI: ${wc}`;
    document.getElementById('hc-b').textContent = `BT: ${bc}`;
    document.getElementById('rf-w').textContent = `● ${wc} WIFI`;
    document.getElementById('rf-b').textContent = `◆ ${bc} BT`;

    const ts = new Date().toLocaleTimeString();
    document.getElementById('ts-w').textContent = ts;
    document.getElementById('ts-b').textContent = ts;
  } catch (_) {}
}

// ── Boot / Safari fixes ───────────────────────────────────────────────────────
function setVh() {
  document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
}
setVh();

window.addEventListener('load', () => {
  setVh();
  // Show saved location badge if present
  const saved = loadSavedLoc();
  if (saved) applyLocation(saved.lat, saved.lng, 'saved', saved.label);
  sizeRadar();
  drawFrame();
  fetchScan();
  setInterval(fetchScan, 5000);
});

window.addEventListener('resize', () => {
  setVh();
  sizeRadar();
});

// Passive touch listeners (improves scroll performance on Safari/iOS)
document.addEventListener('touchstart', function() {}, { passive: true });
</script>
